<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkyFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0E153A, #1B2A6D);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
			padding-top: 72px;
			padding-bottom: 72px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .header {
            background: rgba(10, 16, 35, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(56, 228, 255, 0.2);
			position: fixed;  
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38E4FF;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            width: fit-content;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 0 40px rgba(31, 107, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(135deg, #38E4FF, #1F6BFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-subtitle {
            text-align: center;
            color: #B0B8D1;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #B0B8D1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(56, 228, 255, 0.3);
            color: #fff;
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #38E4FF;
            box-shadow: 0 0 20px rgba(56, 228, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: #6B7489;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #B0B8D1;
            cursor: pointer;
        }

        .checkbox-label input {
            cursor: pointer;
        }

        .forgot-link {
            color: #38E4FF;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #1F6BFF;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #1F6BFF, #38E4FF);
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(31, 107, 255, 0.4);
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #B0B8D1;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #B0B8D1;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #38E4FF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #1F6BFF;
        }

        .alert {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .alert.success {
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid #00C853;
            color: #64DD17;
        }

        .alert.error {
            background: rgba(213, 0, 0, 0.2);
            border: 1px solid #D50000;
            color: #FF1744;
        }
		
		.footer {
            background: rgba(10, 16, 35, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(56, 228, 255, 0.2);
            padding: 0.6rem 1.5rem;
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 90;
        }

        .footer-content {
             max-width: 1400px;
             margin: 0 auto;
             display: flex;
             flex-direction: column; 
             align-items: center;    
             gap: 0.3rem;
        }

        

        .footer-text {
            color: #B0B8D1;
            font-size: 0.9rem;
        }

        .footer-links {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 0.2rem;
         }

        .footer-links a {
            color: #38E4FF;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #1F6BFF;
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem 1.5rem;
            }

            .auth-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <span>✈️</span>
            <span>SkyFlow</span>
        </a>
    </header>

    <div class="container">
        <div class="auth-card">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Login to access your flight dashboard</p>

            <div class="alert" id="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="input-field" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="remember-forgot">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <div class="divider">OR</div>

            <div class="register-link">
                Don't have an account? <a href="register.html">Register now</a>
            </div>
        </div>
    </div>
	
	<footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                © 2026 SkyFlow. All rights reserved.
            </div>
            <div class="footer-links">
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms-of-service.html">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alert = document.getElementById('alert');

            // Simple validation (backend will handle real authentication)
            if (email && password) {
                alert.textContent = 'Login successful! Redirecting...';
                alert.className = 'alert success';
                alert.style.display = 'block';

                // Simulate redirect
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                alert.textContent = 'Please fill in all fields';
                alert.className = 'alert error';
                alert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
