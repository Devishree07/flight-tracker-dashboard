<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkyFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0E153A, #1B2A6D);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
			padding-top: 72px;
            padding-bottom: 72px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .header {
            background: rgba(10, 16, 35, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(56, 228, 255, 0.2);
			position: fixed;  
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
		 }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38E4FF;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            width: fit-content;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 0 40px rgba(31, 107, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin: 2rem 0;
        }

        .auth-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(135deg, #38E4FF, #1F6BFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-subtitle {
            text-align: center;
            color: #B0B8D1;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #B0B8D1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(56, 228, 255, 0.3);
            color: #fff;
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #38E4FF;
            box-shadow: 0 0 20px rgba(56, 228, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: #6B7489;
        }

        .phone-input-group {
            display: flex;
            gap: 0.5rem;
        }

        .country-select {
            width: 140px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(56, 228, 255, 0.3);
            color: #fff;
            border-radius: 10px;
            padding: 0.9rem 0.5rem;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .country-select:focus {
            border-color: #38E4FF;
            box-shadow: 0 0 20px rgba(56, 228, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .country-select option {
            background: #0A1023;
            color: #fff;
        }

        .phone-input {
            flex: 1;
        }

        .otp-group {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(56, 228, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(56, 228, 255, 0.3);
        }

        .otp-group.active {
            display: block;
        }

        .otp-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(56, 228, 255, 0.5);
            color: #fff;
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            text-align: center;
            outline: none;
            margin-top: 0.5rem;
        }

        .verify-btn {
            width: 100%;
            background: linear-gradient(135deg, #00C853, #64DD17);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: all 0.3s ease;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.4);
        }

        .send-otp-btn {
            width: 100%;
            background: transparent;
            border: 2px solid #38E4FF;
            color: #38E4FF;
            padding: 0.6rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .send-otp-btn:hover {
            background: rgba(56, 228, 255, 0.1);
        }

        .send-otp-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            color: #B0B8D1;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .checkbox-label input {
            margin-top: 0.2rem;
            cursor: pointer;
        }

        .checkbox-label a {
            color: #38E4FF;
            text-decoration: none;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #1F6BFF, #38E4FF);
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(31, 107, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #B0B8D1;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #B0B8D1;
            font-size: 0.95rem;
        }

        .login-link a {
            color: #38E4FF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .login-link a:hover {
            color: #1F6BFF;
        }

        .alert {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .alert.success {
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid #00C853;
            color: #64DD17;
        }

        .alert.error {
            background: rgba(213, 0, 0, 0.2);
            border: 1px solid #D50000;
            color: #FF1744;
        }

        .verification-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .verified {
            color: #64DD17;
        }

        .pending {
            color: #FF9100;
        }

        .footer {
            background: rgba(10, 16, 35, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(56, 228, 255, 0.2);
            padding: 0.6rem 1.5rem;
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 90;
        }

        .footer-content {
             max-width: 1400px;
             margin: 0 auto;
             display: flex;
             flex-direction: column; 
             align-items: center;    
             gap: 0.3rem;
        }

        

        .footer-text {
            color: #B0B8D1;
            font-size: 0.9rem;
        }

        .footer-links {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 0.2rem;
         }

        .footer-links a {
            color: #38E4FF;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #1F6BFF;
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem 1.5rem;
            }

            .auth-title {
                font-size: 1.8rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .phone-input-group {
                flex-direction: column;
            }

            .country-select {
                width: 100%;
            }
        }
    </style>
</head>

                    <button type="button" class="send-otp-btn" id="sendPhoneOtp" onclick="sendPhoneOTP()">Send SMS Verification Code</button>
                    <div class="otp-group" id="phoneOtpGroup">
                        <label style="color: #38E4FF; font-size: 0.85rem;">Enter 6-digit code sent to your phone</label>
                        <input 
                            type="text" 
                            class="otp-input" 
                            id="phoneOtp"
                            placeholder="000000"
                            maxlength="6"
                            pattern="[0-9]{6}"
                        >
                        <button type="button" class="verify-btn" onclick="verifyPhoneOTP()">Verify Phone</button>
                    </div>
                    <div class="verification-status pending" id="phoneStatus" style="display: none;">
                        ⏳ Phone verification pending
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field" 
                        placeholder="Create a strong password (min 6 characters)"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="input-field" 
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn" id="registerBtn">Create Account</button>
            </form>

            <div class="divider">OR</div>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                © 2026 SkyFlow. All rights reserved.
            </div>
            <div class="footer-links">
                 <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms-of-service.html">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        let emailVerified = false;
        let phoneVerified = false;
        let generatedEmailOTP = '';
        let generatedPhoneOTP = '';

        // Restrict phone input to numbers only
        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Restrict OTP inputs to numbers only
        document.getElementById('emailOtp').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('phoneOtp').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        function sendEmailOTP() {
            const email = document.getElementById('email').value;
            const alert = document.getElementById('alert');
            
            if (!email) {
                showAlert('Please enter your email address', 'error');
                return;
            }

            // Generate random 6-digit OTP
            generatedEmailOTP = Math.floor(100000 + Math.random() * 900000).toString();
            
            // Show OTP group
            document.getElementById('emailOtpGroup').classList.add('active');
            document.getElementById('emailStatus').style.display = 'flex';
            document.getElementById('sendEmailOtp').disabled = true;
            
            // Simulate sending email (in production, this would call backend API)
            showAlert(`Verification code sent to ${email}! (Demo code: ${generatedEmailOTP})`, 'success');
        }

        function verifyEmailOTP() {
            const enteredOTP = document.getElementById('emailOtp').value;
            
            if (enteredOTP === generatedEmailOTP) {
                emailVerified = true;
                document.getElementById('emailStatus').className = 'verification-status verified';
                document.getElementById('emailStatus').innerHTML = '✓ Email verified';
                document.getElementById('emailOtpGroup').style.display = 'none';
                showAlert('Email verified successfully!', 'success');
            } else {
                showAlert('Invalid verification code. Please try again.', 'error');
            }
        }

        function sendPhoneOTP() {
            const phone = document.getElementById('phone').value;
            const countryCode = document.getElementById('countryCode').value;
            const alert = document.getElementById('alert');
            
            if (!phone || phone.length !== 10) {
                showAlert('Please enter a valid 10-digit phone number', 'error');
                return;
            }

            // Generate random 6-digit OTP
            generatedPhoneOTP = Math.floor(100000 + Math.random() * 900000).toString();
            
            // Show OTP group
            document.getElementById('phoneOtpGroup').classList.add('active');
            document.getElementById('phoneStatus').style.display = 'flex';
            document.getElementById('sendPhoneOtp').disabled = true;
            
            // Simulate sending SMS (in production, this would call backend API)
            showAlert(`Verification code sent to ${countryCode} ${phone}! (Demo code: ${generatedPhoneOTP})`, 'success');
        }

        function verifyPhoneOTP() {
            const enteredOTP = document.getElementById('phoneOtp').value;
            
            if (enteredOTP === generatedPhoneOTP) {
                phoneVerified = true;
                document.getElementById('phoneStatus').className = 'verification-status verified';
                document.getElementById('phoneStatus').innerHTML = '✓ Phone verified';
                document.getElementById('phoneOtpGroup').style.display = 'none';
                showAlert('Phone verified successfully!', 'success');
            } else {
                showAlert('Invalid verification code. Please try again.', 'error');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const countryCode = document.getElementById('countryCode').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            // Validation
            if (!fullName || !email || !phone || !password || !confirmPassword) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            if (!emailVerified) {
                showAlert('Please verify your email address', 'error');
                return;
            }

            if (!phoneVerified) {
                showAlert('Please verify your phone number', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            if (!terms) {
                showAlert('Please accept the terms and conditions', 'error');
                return;
            }

            // Store user data in localStorage (in production, send to backend)
            const userData = {
                fullName: fullName,
                email: email,
                phone: countryCode + phone,
                countryCode: countryCode,
                phoneNumber: phone,
                registeredDate: new Date().toISOString()
            };
            
            localStorage.setItem('skyflowUser', JSON.stringify(userData));

            // Success
            showAlert('Account created successfully! Redirecting...', 'success');

            // Simulate redirect
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
		
    </script>
</body>
</html>
